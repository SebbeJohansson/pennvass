<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fake-grammarly vs Grammarly</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 20px auto; padding: 0 16px; max-width: 1200px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 0 0 6px; }
  .source { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 18px; }
  .source textarea { flex: 1; height: 70px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  textarea, [contenteditable] { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border: 1px solid #bbb; border-radius: 6px; margin-bottom: 14px; }
  .cols textarea { height: 140px; }
  [contenteditable] { min-height: 110px; }
  .label { font-size: 12px; color: #666; margin-bottom: 3px; }
  button, select { font: inherit; padding: 5px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; vertical-align: top; padding: 4px 6px; border-bottom: 1px solid #e5e5e5; }
  .k-spelling { color: #e5484d; } .k-grammar { color: #c47d00; } .k-style { color: #8e4ec6; } .k-clarity { color: #0090ff; }
  .muted { color: #666; font-size: 13px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>fake-grammarly vs Grammarly</h1>
  <div class="source">
    <textarea id="source" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" data-fake-grammarly="off"
      placeholder="Type or paste text here, then Copy to both"></textarea>
    <div>
      <select id="samples"></select><br><br>
      <button id="copy">Copy to both</button>
    </div>
  </div>

  <div class="cols">
    <section>
      <h2>fake-grammarly only</h2>
      <div class="label">textarea</div>
      <textarea class="mine" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
      <div class="label">contenteditable</div>
      <div class="mine" contenteditable="true" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></div>
      <h2>What fake-grammarly found <span class="muted" id="status"></span></h2>
      <table><thead><tr><th>Kind</th><th>Text</th><th>Suggestion</th><th>Why</th></tr></thead><tbody id="found"></tbody></table>
    </section>
    <section>
      <h2>Grammarly only</h2>
      <div class="label">textarea</div>
      <textarea class="theirs" data-fake-grammarly="off"></textarea>
      <div class="label">contenteditable</div>
      <div class="theirs" contenteditable="true" data-fake-grammarly="off"></div>
      <p class="muted">Grammarly's findings show in its own underlines and badge. Open its card or sidebar to read them.</p>
    </section>
  </div>

<script>
const SAMPLES = {
  'English mistakes': 'Their is a error in this sentense. Due to the fact that the report was not being sent by him in a timely manner, the delays were caused.',
  'Email': 'Hi Anna,\n\nMe and him goes to store yesterday for buying the things what we needs. Thanks for you help, I really appriciate it and i will get back to you tomorow with the numbers.\n\nBest regards',
  'Wordy work message': 'I just wanted to quickly reach out in order to let you know that at this point in time we are basically not able to actually deliver the report on Friday, due to the fact that we are still waiting on some data.',
  'Swedish': 'Jag har inte sett den där filmen än, men jag vill gärna se dem. Tack för igår, det var jätte kul. Vi ses imorgon kanske om du har tid?',
  'Clean (should find nothing)': 'Thanks for the update. I will review the draft tomorrow and send my comments by noon.',
}
const select = document.getElementById('samples')
for (const name of Object.keys(SAMPLES)) select.add(new Option(name, name))
select.addEventListener('change', () => { document.getElementById('source').value = SAMPLES[select.value] })
document.getElementById('source').value = SAMPLES[select.value]

function escape(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]) }

function fill(el, text) {
  if (el instanceof HTMLTextAreaElement) el.value = text
  else el.innerHTML = text.split('\n').map(line => `<div>${line ? escape(line) : '<br>'}</div>`).join('')
  // Both extensions re-check on input; Grammarly also wants focus first.
  el.dispatchEvent(new InputEvent('input', { bubbles: true }))
}

async function post(route, text) {
  const response = await fetch(`/v1/write/${route}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) })
  return response.ok ? response.json() : Promise.reject(new Error((await response.json().catch(() => ({}))).error ?? response.status))
}

async function list(text) {
  const status = document.getElementById('status')
  const body = document.getElementById('found')
  body.innerHTML = ''
  status.textContent = 'checking…'
  const started = performance.now()
  try {
    const rows = []
    const check = await post('check', text)
    rows.push(...check.issues)
    const tone = await post('tone', text).catch(() => null)
    status.textContent = `LanguageTool done in ${Math.round(performance.now() - started)} ms; local AI reading…`
    render(rows, text)
    // improve reads 3 new sentences per call; repeat until none are left.
    let improved
    do {
      improved = await post('improve', text)
    } while (improved.pending > 0)
    rows.push(...improved.issues)
    render(rows, text)
    status.textContent = `${rows.length} found in ${((performance.now() - started) / 1000).toFixed(1)} s, ${check.language}${tone ? `, tone ${tone.tone} ${Math.round(tone.probabilities[tone.tone] * 100)}%` : ''}`
  }
  catch (error) {
    status.textContent = `my-agent: ${error.message}`
  }
}

function render(rows, text) {
  document.getElementById('found').innerHTML = rows.sort((a, b) => a.offset - b.offset).map(issue => `<tr>
    <td class="k-${issue.kind}">${issue.kind}</td>
    <td>${escape(text.slice(issue.offset, issue.offset + issue.length))}</td>
    <td>${escape(issue.replacements.slice(0, 3).join(' / ') || '–')}</td>
    <td>${escape(issue.message)}</td></tr>`).join('')
}

document.getElementById('copy').addEventListener('click', () => {
  const text = document.getElementById('source').value
  document.querySelectorAll('.mine, .theirs').forEach(el => fill(el, text))
  list(text)
})
</script>
</body>
</html>
