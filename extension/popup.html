<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #1c2024; --muted: #60646c; --line: #e0e1e6; --ok: #11a36a; --bad: #e5484d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18191b; --fg: #edeef0; --muted: #b0b4ba; --line: #363a3f; } }
  body { margin: 0; width: 280px; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  label { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  small { display: block; color: var(--muted); }
  input[type=text] { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 4px 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  .url { padding: 8px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <h1>fake-grammarly</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Checking my-agent…</span></div>
  <label><span>On <b id="host">this site</b><small>Spelling and grammar (LanguageTool)</small></span><input type="checkbox" id="site"></label>
  <label><span>Clarity<small>Sentence rewrites by qwen2.5:7b, 2–6 s each</small></span><input type="checkbox" id="improve"></label>
  <label><span>Tone<small>Laya reads the tone of the whole text</small></span><input type="checkbox" id="tone"></label>
  <div class="url">my-agent<input type="text" id="baseUrl" spellcheck="false"></div>
  <script src="popup.js"></script>
</body>
</html>
