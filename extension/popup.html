<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #1c2024; --muted: #60646c; --line: #e0e1e6; --ok: #11a36a; --bad: #e5484d; --warn: #c47d00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18191b; --fg: #edeef0; --muted: #b0b4ba; --line: #363a3f; --warn: #ffc53d; } }
  body { margin: 0; width: 300px; padding: 14px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  h1 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 10px; }
  h1 img { width: 20px; height: 20px; }
  .status { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 12px; color: var(--muted); }
  .dot { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .engines { display: block; font-size: 12px; }
  .ok-text { color: var(--ok); } .bad-text { color: var(--bad); } .warn-text { color: var(--warn); }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
  small { display: block; color: var(--muted); }
  select, input[type=text], input[type=password] { box-sizing: border-box; padding: 4px 6px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  details { border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--muted); }
  .field { display: block; margin-top: 8px; }
  .field input { width: 100%; margin-top: 3px; }
  .note { color: var(--bad); font-size: 12px; min-height: 1em; margin-top: 6px; }
</style>
</head>
<body>
  <h1><img src="icons/icon-32.png" alt="">Pennvass</h1>
  <div class="status"><span class="dot" id="dot"></span><span><span id="status">Checking…</span><span class="engines" id="engines"></span></span></div>
  <label><span>Backend<small>Auto uses my-agent when it runs, the engines directly when not</small></span>
    <select id="backend"><option value="auto">Auto</option><option value="my-agent">my-agent</option><option value="direct">Direct</option></select></label>
  <label><span>On <b id="host">this site</b><small>Spelling and grammar (LanguageTool)</small></span><input type="checkbox" id="site"></label>
  <label><span>Clarity<small>Clearer sentences from a local LLM, 2–8 s each</small></span><input type="checkbox" id="improve"></label>
  <label><span>Tone<small>Laya reads the tone of the whole text</small></span><input type="checkbox" id="tone"></label>
  <details>
    <summary>Addresses and keys</summary>
    <span class="field">my-agent<input type="text" data-url="baseUrl" spellcheck="false"></span>
    <span class="field">LanguageTool<input type="text" data-url="languagetoolUrl" spellcheck="false"></span>
    <span class="field">Ollama<input type="text" data-url="ollamaUrl" spellcheck="false"></span>
    <span class="field">Ollama model<input type="text" id="ollamaModel" spellcheck="false"></span>
    <span class="field">Laya<input type="text" data-url="layaUrl" spellcheck="false"></span>
    <span class="field">Laya key<small>Kept in this browser only. Tone is off without it.</small><input type="password" id="layaKey" spellcheck="false" autocomplete="off"></span>
    <div class="note" id="note"></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
